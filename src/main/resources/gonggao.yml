order: 10
announcements:
  - id: trail
    title: 寻路
    pages:
      - |-
        输入 /zhuizong 玩家名，
        前方会出现紫色粒子，
        指向那名玩家。

        再输入一次相同的命令
        就会停止。
      - |-
        输入自己的名字时，
        粒子会指向重生点。

        离得远时，只画身边
        大约一百格。
        往前走，轨迹会继续延伸。
  - id: death-point
    title: 死亡点
    pages:
      - |-
        输入 /zhuizong 死亡，
        粒子会指向上一次
        死去的位置。

        再输入一次就停止。
        如果死在另一个世界，
        会告诉你坐标，
        但画不出轨迹。
